name: Validate and Format

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    container: blackbirdcloud/terraform-toolkit:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # This repository has no root module: validate every submodule and the example.
      - name: Validate and Format
        env:
          TFENV_TERRAFORM_VERSION: latest-allowed
        run: |
          for dir in modules/*/ example/; do
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false && terraform validate && terraform fmt)
            echo "::endgroup::"
          done

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions